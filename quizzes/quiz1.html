<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Unit 1 Quiz</title>

    <link rel="stylesheet"
        href="../style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Prompt Engineering
        </div>

        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

        </div>

    </nav>


    <main class="section">

        <div class="section-heading">

            <span>
                UNIT 01 ASSESSMENT
            </span>

            <h2>
                Introduction to Prompt Engineering & LLMs
            </h2>

        </div>


        <div class="quiz-container">


            <div class="question-card">

                <h3>
                    1. What is a Large Language Model?
                </h3>

                <label>
                    <input type="radio"
                        name="q1"
                        value="a">
                    A model trained to process and generate language
                </label>

                <label>
                    <input type="radio"
                        name="q1"
                        value="b">
                    A computer network
                </label>

                <label>
                    <input type="radio"
                        name="q1"
                        value="c">
                    A database
                </label>

            </div>


            <div class="question-card">

                <h3>
                    2. What is an embedding?
                </h3>

                <label>
                    <input type="radio"
                        name="q2"
                        value="a">
                    A numerical representation of information
                </label>

                <label>
                    <input type="radio"
                        name="q2"
                        value="b">
                    A programming language
                </label>

                <label>
                    <input type="radio"
                        name="q2"
                        value="c">
                    A computer processor
                </label>

            </div>


            <div class="question-card">

                <h3>
                    3. What is the main purpose of Prompt Engineering?
                </h3>

                <label>
                    <input type="radio"
                        name="q3"
                        value="a">
                    To design effective instructions for AI models
                </label>

                <label>
                    <input type="radio"
                        name="q3"
                        value="b">
                    To replace hardware
                </label>

                <label>
                    <input type="radio"
                        name="q3"
                        value="c">
                    To increase internet speed
                </label>

            </div>


            <button onclick="submitQuiz()"
                class="primary-button">

                Submit Quiz

            </button>


            <div id="result">

            </div>

        </div>

    </main>


    <script>

        function submitQuiz() {

            let score = 0;

            if (
                document.querySelector(
                    'input[name="q1"]:checked'
                )?.value === "a"
            ) score++;

            if (
                document.querySelector(
                    'input[name="q2"]:checked'
                )?.value === "a"
            ) score++;

            if (
                document.querySelector(
                    'input[name="q3"]:checked'
                )?.value === "a"
            ) score++;

            let percentage =
                Math.round(
                    (score / 3) * 100
                );

            document.getElementById(
                "result"
            ).innerHTML = `

                <div class="result">

                    <h2>
                        Score: ${score}/3
                    </h2>

                    <p>
                        Percentage: ${percentage}%
                    </p>

                    <br>

                    <p>

                        ${
                            percentage >= 50
                            ? "Congratulations! You passed the quiz."
                            : "Please study the unit and try again."
                        }

                    </p>

                </div>

            `;

            if (percentage >= 50) {

                localStorage.setItem(
                    "unit1Completed",
                    "true"
                );

            }

        }

    </script>

</body>

</html>
