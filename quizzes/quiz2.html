<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Unit 2 Quiz</title>

    <link rel="stylesheet"
        href="../style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Prompt Engineering
        </div>

        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

        </div>

    </nav>


    <main class="section">

        <div class="section-heading">

            <span>
                UNIT 02 ASSESSMENT
            </span>

            <h2>
                Foundations of Prompt Design
            </h2>

        </div>


        <div class="quiz-container">


            <div class="question-card">

                <h3>
                    1. What is zero-shot prompting?
                </h3>

                <label>
                    <input type="radio"
                        name="q1"
                        value="a">
                    Performing a task without examples
                </label>

                <label>
                    <input type="radio"
                        name="q1"
                        value="b">
                    Providing ten examples
                </label>

                <label>
                    <input type="radio"
                        name="q1"
                        value="c">
                    Training a new model
                </label>

            </div>


            <div class="question-card">

                <h3>
                    2. What does few-shot prompting provide?
                </h3>

                <label>
                    <input type="radio"
                        name="q2"
                        value="a">
                    Multiple examples
                </label>

                <label>
                    <input type="radio"
                        name="q2"
                        value="b">
                    No instructions
                </label>

                <label>
                    <input type="radio"
                        name="q2"
                        value="c">
                    Only an image
                </label>

            </div>


            <div class="question-card">

                <h3>
                    3. Which is a prompt evaluation criterion?
                </h3>

                <label>
                    <input type="radio"
                        name="q3"
                        value="a">
                    Relevance
                </label>

                <label>
                    <input type="radio"
                        name="q3"
                        value="b">
                    Screen size
                </label>

                <label>
                    <input type="radio"
                        name="q3"
                        value="c">
                    Keyboard speed
                </label>

            </div>


            <button onclick="submitQuiz()"
                class="primary-button">

                Submit Quiz

            </button>


            <div id="result">

            </div>

        </div>

    </main>


    <script>

        function submitQuiz() {

            let score = 0;

            if (
                document.querySelector(
                    'input[name="q1"]:checked'
                )?.value === "a"
            ) score++;

            if (
                document.querySelector(
                    'input[name="q2"]:checked'
                )?.value === "a"
            ) score++;

            if (
                document.querySelector(
                    'input[name="q3"]:checked'
                )?.value === "a"
            ) score++;

            let percentage =
                Math.round(
                    (score / 3) * 100
                );

            document.getElementById(
                "result"
            ).innerHTML = `

                <div class="result">

                    <h2>
                        Score: ${score}/3
                    </h2>

                    <p>
                        Percentage: ${percentage}%
                    </p>

                </div>

            `;

            if (percentage >= 50) {

                localStorage.setItem(
                    "unit2Completed",
                    "true"
                );

            }

        }

    </script>

</body>

</html>
