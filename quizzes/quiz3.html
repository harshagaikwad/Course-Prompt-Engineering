<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Unit 3 Quiz</title>

    <link rel="stylesheet"
        href="../style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Prompt Engineering
        </div>

        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

        </div>

    </nav>


    <main class="section">

        <div class="section-heading">

            <span>
                UNIT 03 ASSESSMENT
            </span>

            <h2>
                Advanced Prompting Techniques
            </h2>

        </div>


        <div class="quiz-container">


            <div class="question-card">

                <h3>
                    1. What does ReAct combine?
                </h3>

                <label>
                    <input type="radio"
                        name="q1"
                        value="a">
                    Reasoning and Acting
                </label>

                <label>
                    <input type="radio"
                        name="q1"
                        value="b">
                    Reading and Coding
                </label>

                <label>
                    <input type="radio"
                        name="q1"
                        value="c">
                    Retrieval and Classification
                </label>

            </div>


            <div class="question-card">

                <h3>
                    2. What is multimodal prompting?
                </h3>

                <label>
                    <input type="radio"
                        name="q2"
                        value="a">
                    Using multiple input modalities such as text and images
                </label>

                <label>
                    <input type="radio"
                        name="q2"
                        value="b">
                    Using only text
                </label>

                <label>
                    <input type="radio"
                        name="q2"
                        value="c">
                    Using only audio
                </label>

            </div>


            <div class="question-card">

                <h3>
                    3. What is a prompt template?
                </h3>

                <label>
                    <input type="radio"
                        name="q3"
                        value="a">
                    A reusable structure for creating prompts
                </label>

                <label>
                    <input type="radio"
                        name="q3"
                        value="b">
                    A database
                </label>

                <label>
                    <input type="radio"
                        name="q3"
                        value="c">
                    A programming compiler
                </label>

            </div>


            <button onclick="submitQuiz()"
                class="primary-button">

                Submit Quiz

            </button>


            <div id="result">

            </div>

        </div>

    </main>


    <script>

        function submitQuiz() {

            let score = 0;

            if (
                document.querySelector(
                    'input[name="q1"]:checked'
                )?.value === "a"
            ) score++;

            if (
                document.querySelector(
                    'input[name="q2"]:checked'
                )?.value === "a"
            ) score++;

            if (
                document.querySelector(
                    'input[name="q3"]:checked'
                )?.value === "a"
            ) score++;

            let percentage =
                Math.round(
                    (score / 3) * 100
                );

            document.getElementById(
                "result"
            ).innerHTML = `

                <div class="result">

                    <h2>
                        Score: ${score}/3
                    </h2>

                    <p>
                        Percentage: ${percentage}%
                    </p>

                </div>

            `;

            if (percentage >= 50) {

                localStorage.setItem(
                    "unit3Completed",
                    "true"
                );

            }

        }

    </script>

</body>

</html>
